<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiel Bay Forecast</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #07131d;
    --panel: #0d1e2b;
    --panel-2: #12283a;
    --line: #1f3a50;
    --text: #e3eef6;
    --muted: #8aa4b8;
    --sea: #4cc9f0;
    --ok: #3ddc97;
    --bad: #ff5d5d;
    --yellow: #ffd166;
    --orange: #ff9f43;
    --red: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  #map { height: 100%; background: var(--bg); }
  /* Dark map from light OSM tiles. Only the tile layer gets this class, so
     markers, lines, labels and popups keep their real colours. */
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }

  /* Side panel */
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 20px 18px 28px;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h2 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin: 22px 0 8px;
  }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge {
    padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    letter-spacing: .3px; color: #111;
  }
  .badge.yellow { background: var(--yellow); }
  .badge.orange { background: var(--orange); }
  .badge.red    { background: var(--red); color: #fff; }

  .day {
    display: grid; grid-template-columns: 74px 1fr; gap: 4px 12px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .day .date { font-weight: 700; grid-row: span 2; align-self: center; }
  .day .vals { display: flex; justify-content: space-between; gap: 8px; }
  .day .vals span { white-space: nowrap; }
  .day .unit { color: var(--muted); font-size: 12px; }

  .station {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .station:last-child { border-bottom: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .station .meta { color: var(--muted); font-size: 12px; grid-column: 2 / 4; }
  .station .w { font-weight: 700; color: var(--sea); }
  .station .w.ex { color: var(--bad); font-weight: 600; font-size: 12px; }

  .note { color: var(--muted); font-size: 12px; margin-top: 20px; }
  .note a { color: var(--muted); }
  .data-badge { display: inline-block; margin-top: 8px; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .03em; border: 1px solid var(--muted); color: var(--muted); }
  .data-badge.real { border-color: #3ddc97; color: #3ddc97; }
  .data-note { color: var(--orange); font-size: 12px; margin-top: 6px; }
  .day.ref-day { display: block; }
  table.ref { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  table.ref th { color: var(--muted); font-weight: 600; text-align: right; padding: 2px 4px; }
  table.ref th:first-child, table.ref td:first-child { text-align: left; color: var(--muted); }
  table.ref td { text-align: right; padding: 2px 4px; white-space: nowrap; }
  .ref-note { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .error { color: var(--bad); }

  /* Map: popups, labels, sea-point marker */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .pop-title { font-weight: 700; font-size: 14px; }
  .pop-row { color: var(--muted); }
  .pop-issues { margin: 6px 0 0; padding-left: 16px; color: var(--bad); }

  .leaflet-tooltip.label {
    background: transparent; border: 0; box-shadow: none;
    color: var(--text); font-weight: 700; font-size: 11px; letter-spacing: .5px;
    text-shadow: 0 0 4px #000, 0 0 2px #000;
  }
  .leaflet-tooltip.label::before { display: none; }
  .leaflet-container { cursor: crosshair; }
  .leaflet-interactive { cursor: pointer; }
  .busy .leaflet-popup-content { margin: 8px 12px; color: var(--muted); }
  .point-btn {
    margin-top: 10px; background: var(--panel-2); color: var(--sea); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .point-btn:hover { border-color: var(--sea); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .chat-point { color: var(--muted); font-size: 12px; margin-top: 8px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.cmp th { color: var(--muted); font-weight: 600; text-align: right; padding: 4px 4px;
                 border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.cmp td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line);
                 font-variant-numeric: tabular-nums; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp tr.winner td { color: var(--text); font-weight: 700; }
  table.cmp tr.out td { color: var(--muted); }
  table.cmp .ok { color: var(--ok); } table.cmp .bad { color: var(--bad); }
  .cmp-note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .msg.note { align-self: center; color: var(--muted); font-size: 12px; font-style: italic;
              background: none; padding: 2px 0; }

  .sea-marker { position: relative; }
  .sea-marker .core {
    position: absolute; inset: 7px; border-radius: 50%;
    background: var(--sea); box-shadow: 0 0 12px var(--sea);
  }
  .sea-marker .ring {
    position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--sea);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    from { transform: scale(.6); opacity: 1; }
    to   { transform: scale(1.8); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .sea-marker .ring { animation: none; } }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin: 14px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    font: inherit; font-weight: 600; padding: 6px 12px; cursor: pointer; margin-bottom: -1px;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sea); }
  .tabs button:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

  /* Chat */
  .chat-log {
    display: flex; flex-direction: column; gap: 10px;
    max-height: calc(100vh - 290px); min-height: 120px; overflow-y: auto; padding: 12px 2px;
  }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #16455e; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line);
              border-bottom-left-radius: 4px; }
  .msg.bot.thinking { color: var(--muted); font-style: italic; }
  .msg.error { color: var(--bad); }
  .msg details.tools { color: var(--muted); font-size: 11px; margin-top: 6px; white-space: normal; }
  .msg details.tools summary { cursor: pointer; width: fit-content; }
  .msg details.tools summary:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
  .msg details.tools div { margin-top: 4px; }
  .msg .badges { margin-top: 8px; }
  .badge.green { background: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .chips button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--sea); }
  .chat-form { display: flex; gap: 6px; }
  .chat-form input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  .chat-form input:focus { outline: none; border-color: var(--sea); }
  .chat-form button {
    background: var(--sea); color: #04212e; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .chat-form button:disabled, .chat-form input:disabled { opacity: .5; cursor: wait; }
  .disclaimer {
    margin-top: 10px; font-size: 12px; color: var(--yellow);
    border: 1px solid #4a4020; background: #2a2412; border-radius: 8px; padding: 6px 10px;
  }

  /* Phones: map on top, panel below */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    .panel { border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
    .chat-log { max-height: 50vh; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="map" role="region" aria-label="Map of Kiel Bay with weather stations"></div>
  <aside class="panel" id="panel">
    <h1>Kiel Bay marine forecast</h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-forecast" aria-controls="view-forecast" aria-selected="true">Forecast</button>
      <button type="button" role="tab" id="tab-chat" aria-controls="view-chat" aria-selected="false">Ask</button>
    </div>

    <section id="view-forecast" role="tabpanel" aria-labelledby="tab-forecast">
      <div class="sub">Loading…</div>
    </section>

    <section id="view-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
      <div class="chat-point" id="chat-point">Answering for: …</div>
      <div class="chat-log" id="chat-log" aria-live="polite">
        <div class="empty">Ask about the forecast, the stations or whether it's safe to sail.</div>
      </div>
      <div class="chips" id="chips"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" maxlength="500" placeholder="Ask about this forecast…"
               autocomplete="off" aria-label="Your question">
        <button type="submit" id="chat-send">Send</button>
      </form>
      <div class="disclaimer" id="disclaimer"></div>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// The page only DISPLAYS /api/forecast. All numbers were computed by the Python tools.

// Build DOM elements safely: text is always inserted as text, never as HTML.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function warningColor(warning) {
  if (!warning) return null;
  if (warning.startsWith("NEAR GALE")) return "orange";
  if (warning.startsWith("GALE") || warning.startsWith("STORM")) return "red";
  return "yellow";                                  // STRONG WIND
}

function shortWarning(warning) {                    // "NEAR GALE (Beaufort 7, ...)" -> "NEAR GALE · Bft 7"
  const m = warning.match(/^(.*?) \(Beaufort (\d+)/);
  return m ? `${m[1]} · Bft ${m[2]}` : warning;
}

function formatDate(iso) {
  return new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB",
    { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
}

const TREND_ARROW = { rising: "↗", falling: "↘", steady: "→" };

// ---------------------------------------------------------------- map tiles
// Swap the map provider here. `className: "dark-tiles"` applies the dark CSS
// filter (see <style>) to the tile layer only. Remove it for providers that are
// already dark.
const TILE_PROVIDER = {
  url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  options: {
    maxZoom: 19,
    className: "dark-tiles",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  },
};

// ---------------------------------------------------------------- map
const map = L.map("map", { zoomControl: true, attributionControl: true });
L.tileLayer(TILE_PROVIDER.url, TILE_PROVIDER.options).addTo(map);
map.setView([54.6, 10.5], 9);

const MAX_POINT_DISTANCE_KM = 40;     // only for drawing the area; the server decides
const areaLayer = L.layerGroup().addTo(map);    // 40 km circles, drawn once
const pointLayer = L.layerGroup().addTo(map);   // stations, lines, point marker: redrawn per point

let defaultData = null;               // reports/forecast.json (the agent's sea point)
let currentData = null;               // what the map and panel show now
let selectedPoint = null;             // null = default sea point, else {lat, lon}
let labels = [];                      // [{el, prio}] for the overlap check

const pct = w => `${(w * 100).toFixed(0)} %`;

function pointName(data) {
  const p = data.sea_point;
  return data.selected ? `${p.lat.toFixed(2)}° N, ${p.lon.toFixed(2)}° E` : (p.name || "Sea point");
}

function stationLabel(s) {             // one label per station: name + weight (no line labels)
  if (s.weight !== null) return `${s.id} · ${pct(s.weight)}`;
  return `${s.id} · ${s.status === "SUSPECT" ? "excluded" : "unused"}`;
}

function stationPopup(s, data) {
  const box = el("div");
  box.append(el("div", "pop-title", `${s.id} · ${s.name || ""}`));
  box.append(el("div", null, `Status: ${s.status}`));
  box.append(el("div", "pop-row",
    `${s.distance_km} km to the ${data.selected ? "selected point" : "sea point"}`));
  box.append(el("div", "pop-row", s.weight !== null
    ? `Weight in forecast: ${(s.weight * 100).toFixed(1)} %`
    : "Not used in the forecast"));
  if (s.issues.length) {
    const ul = el("ul", "pop-issues");
    s.issues.forEach(issue => ul.append(el("li", null, issue)));
    box.append(ul);
  }
  return box;
}

function seaPopup(data) {
  const box = el("div");
  box.append(el("div", "pop-title", pointName(data)));
  if (!data.forecast) {
    box.append(el("div", "error", "No forecast available"));
    return box;
  }
  data.forecast.daily.forEach(d => {
    box.append(el("div", null,
      `${formatDate(d.date)}: ${d.temp_min_c}–${d.temp_max_c} °C, ${d.pressure_mean_hpa} hPa, wind ${d.wind_max_ms} m/s`));
  });
  return box;
}

function addLabel(layer, text, options, prio) {
  layer.bindTooltip(text, { permanent: true, className: "label", ...options });
  layer.addTo(pointLayer);
  labels.push({ el: layer.getTooltip().getElement(), prio });
}

function drawArea(data) {                // where clicking works: 40 km around each OK station
  data.stations.filter(s => s.status === "OK").forEach(s => {
    L.circle([s.lat, s.lon], {
      radius: MAX_POINT_DISTANCE_KM * 1000, interactive: false,
      color: "#4cc9f0", weight: 1, opacity: 0.25, dashArray: "3 6", fillOpacity: 0.03,
    }).addTo(areaLayer);
  });
}

function drawMap(data, fit) {
  pointLayer.clearLayers();
  labels = [];
  const sea = [data.sea_point.lat, data.sea_point.lon];

  // Dashed lines first, so the markers are drawn on top. Thickness = weight.
  data.stations.filter(s => s.weight).forEach(s => {
    L.polyline([[s.lat, s.lon], sea], {
      color: "#4cc9f0", weight: 1.5 + 5 * s.weight, opacity: 0.75, dashArray: "6 8", interactive: false,
    }).addTo(pointLayer);
  });

  data.stations.forEach(s => {
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: 9, color: "#07131d", weight: 2,
      fillColor: s.status === "OK" ? "#3ddc97" : "#ff5d5d", fillOpacity: 1,
    }).bindPopup(stationPopup(s, data));
    addLabel(marker, stationLabel(s), { direction: "right", offset: [10, 0] }, 10 + (s.weight || 0));
  });

  const seaIcon = L.divIcon({
    className: "sea-marker", iconSize: [28, 28], iconAnchor: [14, 14],
    html: '<div class="ring"></div><div class="core"></div>',
  });
  const seaMarker = L.marker(sea, { icon: seaIcon, title: "Forecast point", keyboard: true })
    .bindPopup(seaPopup(data));
  addLabel(seaMarker, data.selected ? "POINT" : "SEA", { direction: "right", offset: [14, 0] }, 100);

  if (fit) {
    map.fitBounds([sea, ...data.stations.map(s => [s.lat, s.lon])], { padding: [40, 40] });
  }
  declutter();
}

// Overlap check: after every draw, zoom and pan, hide a label that would overlap one with
// higher priority (forecast point > stations with more weight > the rest).
function declutter() {
  const placed = [];
  [...labels].sort((a, b) => b.prio - a.prio).forEach(({ el: label }) => {
    if (!label) return;
    label.style.visibility = "visible";
    const r = label.getBoundingClientRect();
    const hit = placed.some(p => r.left < p.right && r.right > p.left && r.top < p.bottom && r.bottom > p.top);
    if (hit) label.style.visibility = "hidden";
    else placed.push(r);
  });
}
map.on("zoomend moveend", declutter);

function show(data, fit = false) {
  currentData = data;
  drawMap(data, fit);
  drawPanel(data);
  loadReference(data);                  // real data only: Open-Meteo column, filled when it arrives
}

// ---------------------------------------------------------------- click: forecast at a point
// Clicking the map only to close an open popup should not move the point.
// (Our own "Computing…" / "Outside forecast area" notes don't count: clicking again
// right away should pick a new point.)
let openPopups = 0, ignoreClick = false;
const counts = e => e.popup.options.className !== "busy";
map.on("popupopen", e => { if (counts(e)) openPopups++; });
map.on("popupclose", e => { if (counts(e)) openPopups = Math.max(0, openPopups - 1); });
map.on("preclick", () => { ignoreClick = openPopups > 0; });
map.on("click", e => { if (!ignoreClick) selectPoint(e.latlng.wrap()); });

async function selectPoint(latlng) {
  if (!defaultData) return;
  const note = L.popup({ closeButton: false, className: "busy" })
    .setLatLng(latlng).setContent("Computing…").openOn(map);
  try {
    const r = await fetch(`/api/forecast_at?lat=${latlng.lat.toFixed(4)}&lon=${latlng.lng.toFixed(4)}`);
    const body = await r.json();
    if (!r.ok) {
      const msg = el("div", "error", r.status === 400 ? body.detail : "Error: " + (body.detail || r.statusText));
      note.setContent(msg);
      return;                           // the previous point stays selected
    }
    map.closePopup(note);
    selectedPoint = { lat: body.sea_point.lat, lon: body.sea_point.lon };
    show(body);
    pointChanged();
  } catch (err) {
    note.setContent(el("div", "error", "Error: " + err.message));
  }
}

function resetPoint() {
  selectedPoint = null;
  show(defaultData);
  pointChanged();
}

// ---------------------------------------------------------------- panel
function drawPanel(data) {
  const panel = document.getElementById("view-forecast");
  panel.replaceChildren();
  const sp = data.sea_point;
  drawDataBadge(panel, data);
  panel.append(el("div", "sub", data.selected
    ? `Selected point · ${sp.lat.toFixed(2)}° N, ${sp.lon.toFixed(2)}° E`
    : `${sp.name || "Sea point"} · ${sp.lat.toFixed(2)}° N, ${sp.lon.toFixed(2)}° E`));
  if (data.selected) {
    const back = el("button", "point-btn", "← Back to default sea point");
    back.type = "button";
    back.addEventListener("click", resetPoint);
    panel.append(back);
  } else {
    panel.append(el("div", "hint", "Click the map to get the forecast for another point."));
  }

  const f = data.forecast;
  if (!f) {
    panel.append(el("h2", null, "Forecast"));
    panel.append(el("div", "error", "No forecast possible: " + (data.unavailable_reason || "unknown reason")));
  } else {
    // Pressure trend + warning badges
    const t = f.pressure_trend;
    const sign = t.change_hpa > 0 ? "+" : "";
    panel.append(el("h2", null, "Outlook"));
    panel.append(el("span", "pill",
      `${TREND_ARROW[t.label] || ""} Pressure ${t.label} ${sign}${t.change_hpa} hPa`));
    const badges = el("div", "badges");
    f.daily.filter(d => d.wind_warning).forEach(d => {
      badges.append(el("span", "badge " + warningColor(d.wind_warning),
        `${formatDate(d.date).split(",")[0]} · ${shortWarning(d.wind_warning)}`));
    });
    panel.append(badges);

    // Day cards
    panel.append(el("h2", null, "Next " + f.daily.length + " days"));
    f.daily.forEach((d, i) => {
      const card = el("div", "day");
      card.append(el("div", "date", formatDate(d.date) + (d.from_utc ? ` · from ${d.from_utc} UTC` : "")));
      if (isReal(data)) {                  // our estimate next to the Open-Meteo model
        card.classList.add("ref-day");
        card.append(referenceTable(d, f.stations_used.length, referenceDay(data, d.date)));
        if (d.wind_warning) {
          const row = el("div", "vals");
          row.append(el("span", "badge " + warningColor(d.wind_warning), shortWarning(d.wind_warning)));
          card.append(row);
        }
        panel.append(card);
        return;
      }
      const row1 = el("div", "vals");
      row1.append(el("span", null, `🌡 ${d.temp_min_c}–${d.temp_max_c} °C`));
      row1.append(el("span", null, `◎ ${d.pressure_mean_hpa} hPa`));
      const row2 = el("div", "vals");
      row2.append(el("span", null, `💨 ${d.wind_max_ms} m/s`));
      if (d.wind_warning) {
        row2.append(el("span", "badge " + warningColor(d.wind_warning), shortWarning(d.wind_warning)));
      }
      card.append(row1, row2);
      panel.append(card);
    });
    if (isReal(data)) panel.append(referenceNote(data));
  }

  // Stations
  panel.append(el("h2", null, "Stations"));
  data.stations.forEach(s => {
    const row = el("div", "station");
    row.append(el("span", "dot " + (s.status === "OK" ? "ok" : "bad")));
    row.append(el("span", null, `${s.id} · ${s.name || ""}`));
    row.append(s.weight !== null
      ? el("span", "w", `${(s.weight * 100).toFixed(1)} %`)
      : el("span", "w ex", s.status === "SUSPECT" ? "excluded" : "unused"));
    row.append(el("div", "meta", `${s.distance_km} km · ${s.status}` +
      (s.issues.length ? ` · ${s.issues.length} issue(s)` : "")));
    panel.append(row);
  });

  drawComparison(panel);

  const run = defaultData || data;
  const generated = new Date(run.generated_at).toLocaleString("en-GB", { timeZone: "UTC" });
  const footer = el("div", "note",
    `Generated ${generated} UTC by agent.py${run.model ? " (" + run.model + ")" : ""} · ` +
    `Report: ${run.report || "–"} · `);
  if (isReal(data)) {
    footer.append("Observations: ", link(SOURCES.dwd), " via ", link(SOURCES.brightsky),
                  " · Model: ", link(SOURCES.openmeteo), " (", link(SOURCES.ccby), ")");
  } else {
    footer.append("Synthetic data, for learning only. Real-data mode uses observations from ",
                  link(SOURCES.dwd), " via ", link(SOURCES.brightsky), " and the ",
                  link(SOURCES.openmeteo), " model (", link(SOURCES.ccby), ").");
  }
  panel.append(footer);
}

// ---------------------------------------------------------------- data source
// Dummy (synthetic) or real (DWD via Bright Sky) data, as recorded in forecast.json.
// The server refuses to mix them; the page only shows which one it is.
const SOURCES = {
  dwd: ["Deutscher Wetterdienst (DWD)", "https://www.dwd.de/"],
  brightsky: ["Bright Sky", "https://brightsky.dev/"],
  openmeteo: ["Open-Meteo.com", "https://open-meteo.com/"],
  ccby: ["CC BY 4.0", "https://creativecommons.org/licenses/by/4.0/"],
};
const isReal = data => data.data_source === "real";
const utcTime = iso => new Date(iso).toLocaleString("en-GB",
  { timeZone: "UTC", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " UTC";

function link([text, href]) {
  const a = el("a", null, text);
  a.href = href; a.target = "_blank"; a.rel = "noopener";
  return a;
}

function drawDataBadge(panel, data) {
  panel.append(isReal(data)
    ? el("span", "data-badge real", `REAL DATA · DWD · observations until ${utcTime(data.data_time)}`)
    : el("span", "data-badge", "DUMMY DATA – synthetic, for learning"));
  if (data.data_note) panel.append(el("div", "data-note", "⚠ " + data.data_note));
}

// Open-Meteo values for the shown point (/api/reference), loaded after the forecast.
// Comparison only: the agent and the chat never see them.
let reference = null;                  // {key, body}

const pointKey = data => `${data.sea_point.lat},${data.sea_point.lon}`;

async function loadReference(data) {
  if (!isReal(data)) return;
  const key = pointKey(data);
  reference = { key, body: null };
  let body;
  try {
    const r = await fetch(`/api/reference?lat=${data.sea_point.lat}&lon=${data.sea_point.lon}`);
    body = r.ok ? await r.json() : { available: false, reason: "Open-Meteo not available" };
  } catch (err) {
    body = { available: false, reason: "Open-Meteo not available" };
  }
  if (!reference || reference.key !== key) return;      // the user picked another point meanwhile
  reference.body = body;
  if (currentData && pointKey(currentData) === key) drawPanel(currentData);
}

function referenceDay(data, date) {
  if (!reference || reference.key !== pointKey(data)) return undefined;   // still loading
  if (!reference.body) return undefined;
  if (!reference.body.available) return null;
  return reference.body.daily.find(r => r.date === date && r.available !== false) || null;
}

function referenceTable(d, nStations, ref) {
  const table = el("table", "ref");
  const head = el("tr");
  [" ", `Our estimate (${nStations} stations)`, "Open-Meteo model"].forEach(h => head.append(el("th", null, h)));
  table.append(head);
  const other = (fmt) => ref === undefined ? "…" : ref === null ? "–" : fmt(ref);
  [["🌡 Temp", r => `${r.temp_min_c}–${r.temp_max_c} °C`],
   ["💨 Max wind", r => `${r.wind_max_ms} m/s`],
   ["◎ Pressure", r => `${r.pressure_mean_hpa} hPa`]].forEach(([label, fmt]) => {
    const row = el("tr");
    row.append(el("td", null, label), el("td", null, fmt(d)), el("td", null, other(fmt)));
    table.append(row);
  });
  return table;
}

function referenceNote(data) {
  const body = reference && reference.key === pointKey(data) ? reference.body : null;
  if (!body) return el("div", "ref-note", "Loading Open-Meteo…");
  if (!body.available) return el("div", "ref-note", body.reason || "Open-Meteo not available");
  const note = el("div", "ref-note",
    `Open-Meteo: model grid point ${body.grid_point.lat.toFixed(2)}° N, ${body.grid_point.lon.toFixed(2)}° E, ` +
    `same hours as our forecast. Comparison only, not used by the agent.`);
  if (body.data_note) note.append(el("div", "data-note", "⚠ Open-Meteo " + body.data_note));
  return note;
}

// ---------------------------------------------------------------- model comparison
// Filled from /api/model_comparison (written by compare_models.py). Hidden if missing.
// The ranking is decided in code; the page only displays it.
let comparison = null;

function drawComparison(panel) {
  if (!comparison) return;
  panel.append(el("h2", null, "Model comparison"));
  const table = el("table", "cmp");
  const head = el("tr");
  ["Model", "Guardrails", "Tool errors", "Steps", "LLM time"].forEach(h => head.append(el("th", null, h)));
  table.append(head);
  comparison.runs.forEach(r => {
    const row = el("tr", r.model === comparison.winner ? "winner" : (r.disqualified ? "out" : ""));
    row.append(el("td", null, (r.model === comparison.winner ? "🏆 " : "") + r.model));
    const guard = el("td", r.disqualified ? "bad" : "ok", r.disqualified ? "✗" : "✓");
    if (r.disqualified) guard.title = r.disqualify_reasons.join("; ");
    row.append(guard,
      el("td", null, String(r.tool_errors)),
      el("td", null, String(r.steps)),
      el("td", null, `${r.llm_seconds.toFixed(1)} s`));
    table.append(row);
  });
  panel.append(table);
  panel.append(el("div", "cmp-note", comparison.winner
    ? `Winner ${comparison.winner} produced this forecast. ${comparison.scoring_rule}`
    : `No valid run. ${comparison.scoring_rule}`));
}

// ---------------------------------------------------------------- load
fetch("/api/forecast")
  .then(async r => {
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || r.statusText);
    return body;
  })
  .then(async data => {
    defaultData = data;
    if (isReal(data)) {
      map.attributionControl.addAttribution(
        'Observations: <a href="https://www.dwd.de/">DWD</a> via <a href="https://brightsky.dev/">Bright Sky</a>');
      map.attributionControl.addAttribution(
        'Model: <a href="https://open-meteo.com/">Open-Meteo.com</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>)');
    }
    try {                                   // optional: only exists after compare_models.py
      const r = await fetch("/api/model_comparison");
      if (r.ok) comparison = await r.json();
    } catch (err) { /* no comparison: the section stays hidden */ }
    drawArea(data);
    show(data, true);
    pointChanged();
    setupChat(data);
  })
  .catch(err => {
    document.getElementById("view-forecast").replaceChildren(
      el("div", "error", "Could not load the forecast: " + err.message));
  });

// ---------------------------------------------------------------- tabs
const TABS = [["tab-forecast", "view-forecast"], ["tab-chat", "view-chat"]];
function showTab(tabId) {
  TABS.forEach(([tab, view]) => {
    const active = tab === tabId;
    document.getElementById(tab).setAttribute("aria-selected", String(active));
    document.getElementById(view).hidden = !active;
  });
  if (tabId === "tab-chat") document.getElementById("chat-input").focus();
}
TABS.forEach(([tab]) => document.getElementById(tab).addEventListener("click", () => showTab(tab)));

// ---------------------------------------------------------------- chat
// The answer text comes from the LLM: it is always inserted as text, never as HTML.
// Verdict badges come from the sail_safety tool (code), not from the LLM's words.
const VERDICT_COLOR = { "safe": "green", "caution": "yellow", "not safe": "red" };
// Chips and the note depend on the data source (test_chat.py reads both chip lists from here).
const SUGGESTIONS = {
  dummy: ["Is it safe to sail tomorrow?", "Why is EAST excluded?", "Max wind on Friday?"],
  real: ["Is it safe to sail tomorrow?", "Which station counts most?", "How does our wind compare to Open-Meteo?"],
};
const DISCLAIMER = {
  dummy: "Dummy data, not navigation advice.",
  real: "Real observations (DWD) and model data (Open-Meteo). Not navigation advice.",
};
const MAX_HISTORY = 6;
const chatHistory = [];               // [{role, content}], sent along for follow-up questions
const chatLog = document.getElementById("chat-log");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");

function addMessage(className, text) {
  const empty = chatLog.querySelector(".empty");
  if (empty) empty.remove();
  const msg = el("div", "msg " + className, text);
  chatLog.append(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
  return msg;
}

function describeTool(t) {
  const args = t.args && typeof t.args === "object" ? Object.values(t.args).join(", ") : "";
  return `${t.name}(${args})`;
}

let busy = false;                     // one question at a time (also blocks the chips)

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  busy = true;
  addMessage("user", question);
  chatInput.value = "";
  chatInput.disabled = chatSend.disabled = true;
  const thinking = addMessage("bot thinking", "Thinking…");

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history: chatHistory.slice(-MAX_HISTORY), point: selectedPoint }),
    });
    const body = await r.json();
    if (!r.ok) {
      const detail = Array.isArray(body.detail) ? "Invalid question." : body.detail;
      throw new Error(detail || r.statusText);
    }
    thinking.remove();
    const msg = addMessage("bot", body.answer);
    if (body.safety.length) {
      const badges = el("div", "badges");
      body.safety.forEach(s => badges.append(el("span", "badge " + VERDICT_COLOR[s.verdict],
        `${formatDate(s.date)} · ${s.verdict.toUpperCase()}`)));
      msg.append(badges);
    }
    if (body.tools_used.length) {
      // Which tools ran: for the curious, closed by default (internal names stay out of the answer).
      const details = el("details", "tools");
      details.append(el("summary", null, "Details"),
                     el("div", null, "tools: " + body.tools_used.map(describeTool).join(", ")));
      msg.append(details);
    }
    chatHistory.push({ role: "user", content: question }, { role: "assistant", content: body.answer });
    chatLog.scrollTop = chatLog.scrollHeight;
  } catch (err) {
    thinking.remove();
    addMessage("bot error", "Error: " + err.message);
  } finally {
    busy = false;
    chatInput.disabled = chatSend.disabled = false;
    chatInput.focus();
  }
}

// When the selected point changes, earlier answers are about another place:
// clear the history (so follow-ups don't mix points) and say so in the log.
function pointChanged() {
  const name = currentData ? pointName(currentData) : "…";
  document.getElementById("chat-point").textContent = "Answering for: " + name;
  if (chatHistory.length) {
    chatHistory.length = 0;
    addMessage("note", "Now answering for " + name + ".");
  }
}

document.getElementById("chat-form").addEventListener("submit", e => {
  e.preventDefault();
  ask(chatInput.value);
});
// Called once the forecast is loaded, so the chips and note match its data source.
function setupChat(data) {
  const source = isReal(data) ? "real" : "dummy";
  document.getElementById("disclaimer").textContent = DISCLAIMER[source];
  const chips = document.getElementById("chips");
  chips.replaceChildren();
  SUGGESTIONS[source].forEach(q => {
    const chip = el("button", null, q);
    chip.type = "button";
    chip.addEventListener("click", () => ask(q));
    chips.append(chip);
  });
}
</script>
